<body>
  <link rel="stylesheet" href="style.css">

  <div class="unslate_co--section" id="contact-section">
    <div class="container">
      <div class="section-heading-wrap text-center mb-5">
        <h2 class="heading-h2 text-center divider"><span class="gsap-reveal">Get In Touch</span></h2>
        <span class="gsap-reveal"><img src="images/divider.png" alt="divider" width="76"></span>
      </div>

      <div class="contact-container">
        <!-- Left side: Form -->
        <div class="contact-form">
          <form method="post" class="form-outline-style-v1" id="contactForm">
            <div class="form-row">
              <div class="form-field">
                <label for="name">Name</label>
                <input class = "input-form" name="name" type="text" id="name">
              </div>
              <div class="form-field">
                <label for="email">Email</label>
                <input class = "input-form"  name="email" type="email" id="email">
              </div>
            </div>
            <div class="form-row">
              <div class="form-field full">
                <label for="message">Write your message...</label>
                <textarea class = "input-form" name="message" id="message" rows="5"></textarea>
              </div>
            </div>
            <div class="form-row">
              <input type="submit" class="btn btn-outline-pill btn-custom-light" value="Send Message">
              <!-- Hidden export button -->
              <!-- <button id="exportMessages" style="display:none;">Export Messages</button> -->
              <span class="submitting"></span>

            </div>
            <!-- <div id="form-message-warning" class="mt-4"></div> 
            <div id="form-message-success">Your message was sent, thank you!</div> -->
          </form>
        </div>

        <!-- Right side: Contact Info -->
        <div class="contact-info">
          <div class="info-block">
            <span class="label">Email</span>
            <a href="mailto:meflahrachel@gmail.com" class="value">meflahrachel@gmail.com</a>
          </div>
          <div class="info-block">
            <span class="label">Phone</span>
            <a href="tel:+33744541045" class="value">+33 744541045</a>
          </div>
          <div class="info-block">
            <span class="label">Address</span>
            <p class="value">5 rue Pierre Leca<br>Marseille, 13003</p>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Save message to localStorage array
  document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    const data = { name, email, message, timestamp: new Date().toISOString() };

    // Get existing messages or initialize
    const existing = JSON.parse(localStorage.getItem("messages")) || [];
    existing.push(data);

    // Save updated array
    localStorage.setItem("messages", JSON.stringify(existing));

    alert("Message sauvegardé localement !");
  });

  // Secret key to show export button (e.g., press `Ctrl + E`)
  document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.key === "e") {
      document.getElementById("exportMessages").style.display = "inline-block";
    }
  });

  // Export messages to a .json file
  document.getElementById("exportMessages").addEventListener("click", function() {
    const messages = JSON.parse(localStorage.getItem("messages")) || [];
    const jsonData = JSON.stringify(messages, null, 2);
    const blob = new Blob([jsonData], { type: "application/json" });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "contact-messages-log.json";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);

    alert("Fichier JSON exporté !");
  });
</script>


</body>
