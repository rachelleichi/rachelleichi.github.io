<body >
  <main>
 <h1 class="section-title">Experience</h1>
 <span class="gsap-reveal"><img src="images/divider.png" alt="divider" width="76"></span>


          <div id="experience-list">
            <!-- First experience -->
            <div class="experience" data-file="afev.html">
                <img src="images/afev.png" alt="Bénévolat - AFEV" loading="lazy" />
                <div class="overlay">
                  <h3>Bénévolat</h3>
                  <p class="post-meta">Association AFEV <span class="small">&bullet;</span> Septembre 2024 - Présent</p>
                </div>
            </div>

            <!-- Second experience -->
            <div class="experience" data-file="ser.html">
                <img src="images/unis.jpeg" alt="Service Civique - UNIS-CITÉ" loading="lazy" />
                <div class="overlay">
                  <h3>Service Civique</h3>
                  <p class="post-meta">CDD - Association UNIS-CITÉ, Avignon <span class="small">&bullet;</span> Octobre 2023 - Juillet 2024</p>
                </div>
            </div>

            <!-- Third experience -->
            <div class="experience" data-file="pro.html">
                <img src="images/mat.jpeg" alt="Projet recherche du nombre" loading="lazy" />
                <div class="overlay">
                  <h3>Projet recherche du nombre</h3>
                  <p class="post-meta">Ecoles maternelle, Marseille <span class="small">&bullet;</span> Oct 2024 - Dec 2024</p>
                </div>
            </div>

            <!-- First experience -->
            <div class="experience" data-file="int.html">
                <img src="images/int.png" alt="Bénévolat - AFEV" loading="lazy" />
                <div class="overlay">
                  <h3>Stage IOT</h3>
                  <p class="post-meta">Stage IOT <span class="small">&bullet;</span> Avril 2025 - Juin 2025</p>
                </div>
            </div>
          </div>
          <!-- End experience-list -->

  

    </main>
     <script>

        document.querySelectorAll('.experience').forEach(project => {
          project.style.cursor = 'pointer'; // changer le curseur
          project.addEventListener('click', () => {
              const file = project.getAttribute('data-file');
              if (file) {
                  window.location.href = file; // redirection vers le fichier
              }
          });
      });



      </script>
</body>
