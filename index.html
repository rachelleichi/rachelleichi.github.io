<script>
  document.addEventListener("DOMContentLoaded", function () {
    const sections = {
      'portfolio-section': 'projects.html',
      'about-section': 'about.html',
      'services-section': 'competences.html',
      'skills-section': 'skills.html',
      'testimonial-section': 'stage.html',
      'journal-section': 'experiences.html',
      'contact-section': 'contact.html'
    };

    for (const [id, file] of Object.entries(sections)) {
      fetch(file)
        .then(response => response.text())
        .then(data => {
          document.getElementById(id).innerHTML = data;
        })
        .catch(error => {
          console.error(`Failed to load ${file}:`, error);
        });
    }
  });
</script>
